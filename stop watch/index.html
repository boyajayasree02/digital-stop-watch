<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple digital stopwatch with lap tracking.">
  <title>Digital Stopwatch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stopwatch-app">
    <section class="stopwatch-panel" aria-labelledby="page-title">
      <p class="eyebrow">TIMEKEEPER</p>
      <h1 id="page-title">Digital Stopwatch</h1>

      <div class="timer" aria-live="off" aria-label="Elapsed time">
        <span id="hours">00</span>
        <span class="separator">:</span>
        <span id="minutes">00</span>
        <span class="separator">:</span>
        <span id="seconds">00</span>
        <span class="separator">:</span>
        <span id="milliseconds">00</span>
      </div>
      <p class="timer-label">HOURS&nbsp;&nbsp; MINUTES&nbsp;&nbsp; SECONDS&nbsp;&nbsp; MILLISECONDS</p>

      <div class="controls" aria-label="Stopwatch controls">
        <button class="button button-start" id="startButton" type="button">Start</button>
        <button class="button button-pause" id="pauseButton" type="button">Pause</button>
        <button class="button button-reset" id="resetButton" type="button">Reset</button>
        <button class="button button-lap" id="lapButton" type="button">Lap</button>
      </div>

      <div class="lap-section">
        <div class="lap-heading">
          <h2>Laps <span id="lapCount">0</span></h2>
          <button class="clear-button" id="clearLapsButton" type="button">Clear laps</button>
        </div>
        <ol class="laps" id="lapsList" aria-live="polite">
          <li class="empty-state" id="emptyState">Your recorded laps will appear here.</li>
        </ol>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
